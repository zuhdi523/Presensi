<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Presensi Siswa</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#13213C">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Presensi">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --latar: #EEF2F7; --panel: #FFFFFF; --tinta: #13213C; --tinta-2: #5B6782; --garis: #D5DCE8;
      --navy: #13213C; --navy-2: #1E3060; --emas: #FFC53D;
      --datang: #0E9F6E; --telat: #EA580C; --pulang: #4F46E5; --sudah: #56657F; --gagal: #DC2D4B;
      --tepi: clamp(14px, 3vw, 32px);
      --bayang: 0 1px 2px rgba(19, 33, 60, .06), 0 8px 24px -12px rgba(19, 33, 60, .18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --latar: #0B1220; --panel: #141D30; --tinta: #E8EDF7; --tinta-2: #9AA6BF; --garis: #26324A;
        --navy: #1A2742; --navy-2: #24365E;
        --bayang: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .5);
      }
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0; min-height: 100%; min-height: 100dvh;
      background: var(--latar); color: var(--tinta);
      font: 16px/1.45 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      -webkit-tap-highlight-color: transparent;
    }
    body.mode-scan { background: #0B1220; color: #E8EDF7; }
    [hidden] { display: none !important; }
    button { font: inherit; cursor: pointer; color: inherit; }
    button:focus-visible, input:focus-visible, .foto:focus-within { outline: 3px solid var(--emas); outline-offset: 2px; }
    svg { display: block; }

    .offline { background: var(--telat); color: #fff; text-align: center; font-weight: 700; font-size: .9rem; padding: 8px var(--tepi); }

    /* Tombol ikon bulat */
    .ikon {
      position: relative; flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%;
      display: inline-grid; place-items: center; padding: 0;
      background: var(--panel); color: var(--tinta); box-shadow: var(--bayang);
    }
    .ikon svg { width: 22px; height: 22px; }
    .ikon:disabled { opacity: .5; cursor: wait; }
    .sinkron { color: var(--telat); }
    .jumlah {
      position: absolute; top: -3px; right: -3px; min-width: 20px; height: 20px; padding: 0 5px;
      border-radius: 999px; background: var(--telat); color: #fff;
      font-size: .72rem; font-weight: 800; line-height: 20px; text-align: center;
      box-shadow: 0 0 0 2px var(--latar);
    }
    .kanan { display: flex; align-items: center; gap: 8px; }

    /* ================= HALAMAN 1 ================= */
    #hal1 {
      max-width: 560px; margin: 0 auto; padding: 16px var(--tepi) 24px;
      min-height: 100dvh; display: flex; flex-direction: column; gap: 18px;
    }
    .bar-atas { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .merek { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; letter-spacing: -0.01em; }
    .merek img { width: 34px; height: 34px; border-radius: 10px; }
    .btn-pasang { border: 0; border-radius: 999px; padding: 10px 14px; font-weight: 700; font-size: .9rem; background: var(--panel); box-shadow: var(--bayang); }

    /* Kartu jam (pusat perhatian halaman depan) */
    .hero {
      position: relative; overflow: hidden; border-radius: 24px; padding: 22px 22px 20px;
      background: var(--navy); color: #fff; box-shadow: var(--bayang);
    }
    .hero::after {
      /* lingkaran matahari pagi samar di pojok */
      content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 197, 61, .32), rgba(255, 197, 61, 0) 70%);
      pointer-events: none;
    }
    .tanggal { margin: 0; color: #C3CDE3; font-weight: 600; }
    .jam { margin: 2px 0 14px; display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; line-height: 1; }
    #jamLive { font-size: clamp(3.6rem, 16vw, 6.2rem); font-weight: 800; letter-spacing: -0.04em; }
    #detikLive { font-size: clamp(1.3rem, 5vw, 2rem); font-weight: 700; color: var(--emas); }
    .batas-baris { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .pil-batas { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 8px 14px; background: rgba(255, 255, 255, .1); font-weight: 600; }
    .pil-batas strong { font-weight: 800; color: var(--emas); font-variant-numeric: tabular-nums; }
    .btn-ubah { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; background: #fff; color: var(--navy); }
    .status-batas { margin: 12px 0 0; min-height: 1.45em; font-size: .9rem; color: #C3CDE3; display: flex; align-items: center; gap: 8px; }
    .status-batas::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--datang); flex: none; }
    .status-batas.dekat::before { background: var(--emas); }
    .status-batas.lewat::before { background: var(--telat); }
    .status-batas.lewat { color: #FFD2B8; }

    .form-batas { position: relative; z-index: 1; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, .14); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-batas label { display: grid; gap: 4px; font-weight: 700; font-size: .85rem; color: #C3CDE3; }
    .form-batas input { font: inherit; color: #fff; padding: 10px 12px; border-radius: 12px; border: 1.5px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .08); width: 100%; color-scheme: dark; }
    .pesan-err { grid-column: 1 / -1; color: #FFB4A8; font-weight: 700; font-size: .88rem; margin: 0; min-height: 1.2em; }
    .aksi { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }
    .aksi button { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; }
    .btn-batal { background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .3); }
    .btn-simpan { background: var(--emas); color: var(--navy); }

    /* Pilihan Datang / Pulang */
    .judul { font-weight: 800; margin: 0 0 10px; font-size: 1.05rem; }
    .mode { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mode button {
      --warna: var(--datang);
      position: relative; border: 0; border-radius: 20px; padding: 16px; text-align: left;
      background: var(--panel); box-shadow: var(--bayang), inset 0 0 0 2px transparent;
      display: grid; gap: 10px; align-content: start; transition: box-shadow .15s, transform .15s;
    }
    .mode button.pulang { --warna: var(--pulang); }
    .mode .ikon-mode { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--warna) 14%, transparent); color: var(--warna); }
    .mode .ikon-mode svg { width: 24px; height: 24px; }
    .mode .nama-mode { font-weight: 800; font-size: 1.2rem; }
    .mode .ket-mode { color: var(--tinta-2); font-size: .85rem; margin-top: -8px; }
    .mode button[aria-pressed="true"] { box-shadow: var(--bayang), inset 0 0 0 2.5px var(--warna); background: color-mix(in srgb, var(--warna) 7%, var(--panel)); }
    .mode .centang { position: absolute; top: 14px; right: 14px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--warna); color: #fff; opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
    .mode .centang svg { width: 14px; height: 14px; }
    .mode button[aria-pressed="true"] .centang { opacity: 1; transform: none; }

    /* Tombol scan */
    .btn-scan {
      --warna: var(--datang);
      margin-top: auto; border: 0; border-radius: 22px; padding: 14px 18px 14px 14px; color: #fff;
      background: var(--warna); box-shadow: 0 12px 28px -12px var(--warna);
      display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: clamp(1.15rem, 2.2vw, 1.35rem); text-align: left;
    }
    .btn-scan.pulang { --warna: var(--pulang); }
    .btn-scan .kotak-qr { width: 52px; height: 52px; border-radius: 14px; background: rgba(255, 255, 255, .18); display: grid; place-items: center; flex: none; }
    .btn-scan .kotak-qr svg { width: 28px; height: 28px; }
    .btn-scan:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .info-data { color: var(--tinta-2); font-size: .9rem; margin: -6px 0 0; min-height: 1.45em; text-align: center; }
    .info-data:empty { visibility: hidden; }   /* tetap memakan tempat, jadi tombol tidak bergeser */

    @media (hover: hover) {
      .mode button:hover { transform: translateY(-1px); }
      .btn-scan:not(:disabled):hover { filter: brightness(1.06); }
    }

    /* Tablet & laptop: dua kolom */
    @media (min-width: 820px) {
      #hal1 {
        max-width: 1060px; padding-top: 28px; display: grid; gap: 22px 28px;
        grid-template-columns: 1.15fr 1fr; align-content: start;
        grid-template-areas: "atas atas" "hero pilih" "hero scan" "info info";
      }
      .bar-atas { grid-area: atas; }
      .hero { grid-area: hero; padding: 32px; display: flex; flex-direction: column; justify-content: center; }
      .blok-mode { grid-area: pilih; }
      .btn-scan { grid-area: scan; margin-top: 0; align-self: end; padding: 18px 22px 18px 18px; }
      .info-data { grid-area: info; }
      .mode button { padding: 20px; }
    }

    /* ================= HALAMAN 2: SCAN ================= */
    /* Kamera memenuhi seluruh layar, tegak maupun mendatar */
    #hal2 { position: fixed; inset: 0; background: #050A14; }
    .mode-scan { overflow: hidden; }
    .scan-isi { position: absolute; inset: 0; }
    .atas {
      position: absolute; top: 0; left: 0; right: 0; z-index: 3;
      display: flex; align-items: center; gap: 8px;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-right, 0px) + 12px) 28px calc(env(safe-area-inset-left, 0px) + 12px);
      background: linear-gradient(rgba(5, 10, 20, .7), rgba(5, 10, 20, 0));
    }
    .atas .kanan { margin-left: auto; }
    .kembali { border: 0; background: rgba(5, 10, 20, .45); backdrop-filter: blur(6px); color: #fff; font-weight: 700; padding: 10px 16px 10px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
    .kembali svg { width: 20px; height: 20px; }
    .mode-scan .ikon { background: rgba(5, 10, 20, .45); backdrop-filter: blur(6px); color: #fff; box-shadow: none; }
    .mode-scan .sinkron { color: #FFB27A; }
    .mode-scan .jumlah { box-shadow: none; }
    .chip { font-weight: 800; color: #fff; border-radius: 999px; padding: 10px 16px; background: var(--datang); display: inline-flex; align-items: center; gap: 8px; }
    .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
    .chip.pulang { background: var(--pulang); }

    .bidik { position: absolute; inset: 0; background: #050A14; overflow: hidden; container-type: size; }
    #reader { width: 100%; height: 100%; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
    .bidik.cermin #reader video { transform: scaleX(-1); }
    /* Bingkai kuning hanya panduan arah; seluruh gambar kamera tetap dipindai */
    .bingkai {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none;
      width: 80%; height: 70%; width: min(86cqw, 70cqh); height: min(86cqw, 70cqh);
    }
    .sudut { position: absolute; width: 44px; height: 44px; border: 5px solid var(--emas); }
    .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 28px; }
    .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 28px; }
    .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 28px; }
    .br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 28px; }
    .bidik:not(.aktif) .bingkai { display: none; }

    .mulai { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 12px; text-align: center; color: #C3CDE3; padding: 24px; z-index: 1; }
    .bidik.aktif .mulai { display: none; }
    #mulaiTeks { max-width: 34ch; }
    .mulai button, .mulai .foto { border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; background: var(--emas); color: var(--navy); }
    .mulai .foto { background: transparent; color: #fff; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .4); position: relative; cursor: pointer; }
    .mulai .foto input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    /* Notifikasi hasil scan */
    .hasil {
      --warna: var(--datang);
      position: absolute; z-index: 2; max-width: 640px; margin: 0 auto;
      left: calc(env(safe-area-inset-left, 0px) + 12px); right: calc(env(safe-area-inset-right, 0px) + 12px);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      display: flex; align-items: center; gap: 14px;
      padding: clamp(14px, 2vw, 20px); border-radius: 22px; color: #fff;
      background: var(--warna);
      box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .18);
    }
    .hasil.Terlambat { --warna: var(--telat); }
    .hasil.Pulang { --warna: var(--pulang); }
    .hasil.Sudah { --warna: var(--sudah); }
    .hasil.Gagal { --warna: var(--gagal); }
    .hasil-ikon { flex: none; width: clamp(52px, 7vw, 68px); height: clamp(52px, 7vw, 68px); border-radius: 50%; background: #fff; color: var(--warna); display: grid; place-items: center; }
    .hasil-ikon svg { width: 55%; height: 55%; }
    .hasil-teks { min-width: 0; display: grid; gap: 6px; }
    .hasil-nama { font-size: clamp(1.25rem, 2.6vw, 1.9rem); font-weight: 800; line-height: 1.15; letter-spacing: -0.01em; overflow-wrap: anywhere; }
    .hasil-baris { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hasil-kelas { border-radius: 999px; padding: 3px 10px; background: rgba(255, 255, 255, .22); font-weight: 700; font-size: .9rem; }
    .hasil-ket { font-weight: 800; font-size: clamp(1rem, 1.8vw, 1.2rem); }
    .hasil.muncul { animation: muncul .22s cubic-bezier(.2, .9, .3, 1.2); }
    @keyframes muncul { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .hasil.muncul { animation: none; }
      .mode button, .mode .centang { transition: none; }
    }

    /* HP mendatar (layar pendek): notifikasi lebih ringkas */
    @media (orientation: landscape) and (max-height: 520px) {
      .atas { padding-top: calc(env(safe-area-inset-top, 0px) + 6px); }
      .hasil { bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); padding: 10px 14px; }
      .hasil-nama { font-size: 1.15rem; }
      .hasil-ikon { width: 44px; height: 44px; }
    }
  </style>
</head>
<body>

<div class="offline" id="pitaOffline" role="status" hidden>Tidak ada sinyal. Scan tetap jalan dan disimpan di perangkat ini.</div>

<!-- ================= HALAMAN 1 ================= -->
<section id="hal1">
  <header class="bar-atas">
    <div class="merek"><img src="icon-192.png" alt="" onerror="this.remove()">Presensi Siswa</div>
    <div class="kanan">
      <button class="btn-pasang" id="btnPasang" hidden>Pasang aplikasi</button>
      <button class="ikon sinkron" id="sinkron1" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg><span class="jumlah"></span></button>
    </div>
  </header>

  <div class="hero">
    <p class="tanggal" id="tanggal"></p>
    <div class="jam" aria-live="off"><span id="jamLive">--:--</span><span id="detikLive">--</span></div>
    <div class="batas-baris">
      <span class="pil-batas">Batas datang <strong id="jamBatas">--:--</strong></span>
      <button class="btn-ubah" id="btnUbah">Ubah</button>
    </div>
    <p class="status-batas" id="statusBatas"></p>

    <div class="form-batas" id="formBatas" hidden>
      <label>Jam baru<input type="time" id="inJam"></label>
      <label>PIN admin<input type="password" id="inPin" inputmode="numeric" autocomplete="off"></label>
      <p class="pesan-err" id="errBatas"></p>
      <div class="aksi">
        <button class="btn-batal" id="btnBatal">Batal</button>
        <button class="btn-simpan" id="btnSimpan">Simpan batas</button>
      </div>
    </div>
  </div>

  <div class="blok-mode">
    <p class="judul">Jenis presensi</p>
    <div class="mode" role="group" aria-label="Jenis presensi">
      <button class="datang" id="mDatang" aria-pressed="true">
        <span class="ikon-mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/></svg></span>
        <span class="nama-mode">Datang</span>
        <span class="ket-mode">Siswa tiba di sekolah</span>
        <span class="centang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      </button>
      <button class="pulang" id="mPulang" aria-pressed="false">
        <span class="ikon-mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
        <span class="nama-mode">Pulang</span>
        <span class="ket-mode">Siswa meninggalkan sekolah</span>
        <span class="centang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      </button>
    </div>
  </div>

  <button class="btn-scan" id="btnScan" disabled>
    <span class="kotak-qr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg></span>
    <span id="labelScan">Mulai scan Datang</span>
  </button>
  <p class="info-data" id="statusData" role="status">Mengunduh data siswa…</p>
</section>

<!-- ================= HALAMAN 2: SCAN ================= -->
<section id="hal2" hidden>
  <div class="scan-isi">
    <div class="atas">
      <button class="kembali" id="btnKembali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Selesai
      </button>
      <div class="kanan">
        <button class="ikon sinkron" id="sinkron2" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg><span class="jumlah"></span></button>
        <button class="ikon" id="btnGanti" aria-label="Ganti kamera" title="Ganti kamera" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/><path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/><circle cx="12" cy="12" r="3"/><path d="m18 22-3-3 3-3"/><path d="m6 2 3 3-3 3"/></svg></button>
        <span class="chip" id="chipMode">Datang</span>
      </div>
    </div>

    <div class="bidik" id="bidik">
      <div id="reader"></div>
      <div class="bingkai"><span class="sudut tl"></span><span class="sudut tr"></span><span class="sudut bl"></span><span class="sudut br"></span></div>
      <div class="mulai" id="mulai">
        <span id="mulaiTeks">Menyalakan kamera…</span>
        <button id="btnMulai" hidden>Coba lagi</button>
        <label class="foto" id="btnFoto" hidden>Foto QR dengan kamera HP
          <input type="file" id="inFoto" accept="image/*" capture="environment">
        </label>
      </div>
      <div class="hasil" id="hasil" role="status" aria-live="assertive" hidden></div>
    </div>
  </div>
</section>

<script>
  /* ====== Untuk GitHub Pages: isi dengan URL Web App (.../exec). Di Apps Script biarkan saja. ====== */
  const API_URL = 'https://script.google.com/macros/s/AKfycbyTHq66pjzYokB_bc5hlLye3E8x9bs-0f15rJGVHUYoPutoPw0FQbzgSc1LY261jDD7/exec';

  const JEDA_QR_SAMA_MS = 5000;   // QR yang sama diabaikan selama 5 detik
  const LAMA_HASIL_MS = 2500;     // lama kartu hasil tampil
  const SINKRON_MS = 60 * 1000;   // ambil scan dari HP lain tiap 1 menit
  const $ = (id) => document.getElementById(id);
  const diGAS = typeof google !== 'undefined' && google.script && google.script.run;
  const simpanLokal = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const bacaLokal = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } };
  const hapusLokal = (k) => { try { localStorage.removeItem(k); } catch (e) {} };

  /* ---------- Pemanggil server: google.script.run di GAS, fetch di GitHub ---------- */
  function panggil(aksi, data) {
    if (diGAS) {
      const peta = {
        config:   ['getConfig', []],
        awal:     ['getDataAwal', []],
        hariIni:  ['getHariIni', []],
        batch:    ['catatBatch', [data.items]],
        setBatas: ['setBatas', [data.jam, data.pin]]
      };
      const [fn, args] = peta[aksi];
      return new Promise((ok, gagal) =>
        google.script.run.withSuccessHandler(ok).withFailureHandler(e => gagal(new Error(e.message || e)))[fn](...args));
    }
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // tanpa preflight CORS
      body: JSON.stringify({ aksi, ...data })
    })
      .then(r => r.json())
      .then(r => { if (!r.ok) throw new Error(r.error); return r.data; });
  }

  /* =====================================================================
     DATA DI PERANGKAT
     Daftar siswa & presensi hari ini disimpan di HP, jadi saat scan nama dan
     status bisa langsung tampil tanpa menunggu server.
     ===================================================================== */
  hapusLokal('pinPetugas');   // sisa versi lama
  let siswaMap = new Map();                 // noInduk -> {panggilan, nama, kelas}
  let hariIni = { tanggal: '', datang: new Map(), pulang: new Map() };  // noInduk -> {ket, jam}
  let batas = '07:00';
  let tz = 'Asia/Jakarta';
  let selisihJamMs = 0;                     // jam server - jam HP
  let antrean = JSON.parse(bacaLokal('antrean', '[]'));

  const sekarang = () => Date.now() + selisihJamMs;
  const fmt = (opsi) => new Intl.DateTimeFormat('en-GB', { timeZone: tz, hourCycle: 'h23', ...opsi });
  const jamMenit = (t) => fmt({ hour: '2-digit', minute: '2-digit' }).format(t);
  const jamDetik = (t) => fmt({ hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(t);
  const tanggalKey = (t) => new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(t);

  function terapkanSiswa(list) {
    siswaMap = new Map(list.map(([no, panggilan, nama, kelas]) => [no, { panggilan, nama, kelas }]));
  }

  let baruTerkirim = [];   // scan yang baru terkirim (mungkin belum terbaca oleh sinkron yang sedang berjalan)

  /**
   * Ganti data presensi hari ini dengan data dari spreadsheet.
   * Data yang dihapus di spreadsheet ikut hilang dari perangkat.
   * Scan yang belum terkirim / baru saja terkirim tetap dihitung.
   */
  function terapkanHariIni(d) {
    tz = d.tz || tz;
    batas = d.batas || batas;
    selisihJamMs = d.serverMs - Date.now();
    const datang = new Map(), pulang = new Map();
    d.datang.forEach(([no, ket, jam]) => { if (!datang.has(no)) datang.set(no, { ket, jam }); });
    d.pulang.forEach(([no, ket, jam]) => { if (!pulang.has(no)) pulang.set(no, { ket, jam }); });
    const batasBaru = Date.now() - 3 * 60 * 1000;
    baruTerkirim = baruTerkirim.filter(it => it.dikirim > batasBaru);
    [...antrean, ...baruTerkirim].forEach(it => {
      if (!it.ket || tanggalKey(it.t) !== d.tanggal) return;
      const m = it.mode === 'pulang' ? pulang : datang;
      if (!m.has(it.qr)) m.set(it.qr, { ket: it.ket, jam: it.jam });
    });
    hariIni = { tanggal: d.tanggal, datang, pulang };
    setTimeout(perbaruiJam, 0);
  }

  function simpanCache(siswaList) {
    if (siswaList) simpanLokal('cacheSiswa', JSON.stringify(siswaList));
    simpanLokal('cacheHariIni', JSON.stringify({
      tanggal: hariIni.tanggal, tz, batas,
      datang: [...hariIni.datang].map(([no, v]) => [no, v.ket, v.jam]),
      pulang: [...hariIni.pulang].map(([no, v]) => [no, v.ket, v.jam])
    }));
  }

  function cekGantiHari() {
    const tgl = tanggalKey(sekarang());
    if (hariIni.tanggal !== tgl) {
      hariIni = { tanggal: tgl, datang: new Map(), pulang: new Map() };
      simpanCache();
    }
  }

  // Pakai data tersimpan dulu supaya halaman langsung siap, lalu perbarui dari server
  try {
    const cs = JSON.parse(bacaLokal('cacheSiswa', 'null'));
    const ch = JSON.parse(bacaLokal('cacheHariIni', 'null'));
    if (cs) terapkanSiswa(cs);
    if (ch) { terapkanHariIni({ ...ch, serverMs: Date.now() }); cekGantiHari(); }
  } catch (e) {}

  /* ================= HALAMAN 1 ================= */
  /* Jam besar di halaman depan (memakai jam server, zona sekolah) */
  function perbaruiJam() {
    const t = sekarang();
    $('jamLive').textContent = jamMenit(t);
    $('detikLive').textContent = jamDetik(t).slice(6);
    $('tanggal').textContent = new Intl.DateTimeFormat('id-ID',
      { timeZone: tz, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(t);
    $('jamBatas').textContent = batas;

    const [h, m] = jamMenit(t).split(':').map(Number);
    const [bh, bm] = batas.split(':').map(Number);
    const sisa = (bh * 60 + bm) - (h * 60 + m);
    const el = $('statusBatas');
    if (sisa < 0) { el.textContent = 'Lewat batas: scan datang tercatat terlambat'; el.className = 'status-batas lewat'; }
    else if (sisa <= 60) { el.textContent = sisa === 0 ? 'Menit terakhir sebelum batas' : `${sisa} menit lagi menuju batas`; el.className = 'status-batas dekat'; }
    else { el.textContent = 'Masih jauh dari batas jam datang'; el.className = 'status-batas'; }
  }
  setInterval(perbaruiJam, 1000);

  let mode = bacaLokal('modePresensi', 'datang');
  function setMode(m) {
    mode = m;
    simpanLokal('modePresensi', m);
    $('mDatang').setAttribute('aria-pressed', m === 'datang');
    $('mPulang').setAttribute('aria-pressed', m === 'pulang');
    const label = m === 'pulang' ? 'Pulang' : 'Datang';
    $('labelScan').textContent = 'Mulai scan ' + label;
    $('btnScan').className = 'btn-scan ' + m;
    $('chipMode').textContent = label;
    $('chipMode').className = 'chip ' + m;
  }
  $('mDatang').onclick = () => setMode('datang');
  $('mPulang').onclick = () => setMode('pulang');
  setMode(mode);

  /** Pesan hanya tampil jika ada kendala (belum ada data, gagal unduh). */
  function perbaruiStatusData(pesan) {
    const siap = siswaMap.size > 0;
    $('btnScan').disabled = !siap;
    $('statusData').textContent = pesan || (siap ? '' : 'Belum ada data siswa.');

  }

  async function muatAwal() {
    if (!siswaMap.size) perbaruiStatusData('Mengunduh data siswa…');
    try {
      const d = await panggil('awal', {});
      terapkanSiswa(d.siswa);
      terapkanHariIni(d);
      simpanCache(d.siswa);
      perbaruiStatusData();
    } catch (err) {
      console.warn('Gagal memperbarui data:', err.message);
      perbaruiStatusData(siswaMap.size
        ? ''
        : (navigator.onLine ? 'Gagal mengunduh data siswa: ' + err.message
                            : 'Sedang offline. Data siswa perlu diunduh sekali saat ada sinyal.'));
    }
  }


  $('btnUbah').onclick = () => {
    $('inJam').value = batas || '07:00';
    $('inPin').value = ''; $('errBatas').textContent = '';
    $('formBatas').hidden = false; $('btnUbah').hidden = true;
    $('inJam').focus();
  };
  $('btnBatal').onclick = () => { $('formBatas').hidden = true; $('btnUbah').hidden = false; };
  $('btnSimpan').onclick = async () => {
    $('errBatas').textContent = '';
    $('btnSimpan').disabled = true;
    try {
      const r = await panggil('setBatas', { jam: $('inJam').value, pin: $('inPin').value });
      batas = r.batas;
      perbaruiJam();
      simpanCache();
      $('btnBatal').onclick();
    } catch (err) {
      $('errBatas').textContent = err.message;
    } finally {
      $('btnSimpan').disabled = false;
    }
  };

  /* ---------- Perpindahan halaman (tombol Back HP ikut berfungsi) ---------- */
  let dariHal1 = false;
  $('btnScan').onclick = () => { dariHal1 = true; location.hash = 'scan'; };
  $('btnKembali').onclick = () => {
    if (dariHal1) { dariHal1 = false; history.back(); }
    else location.hash = '';
  };

  function tampilkanHalaman() {
    const diScan = location.hash === '#scan' && siswaMap.size > 0;
    if (location.hash === '#scan' && !diScan) { location.hash = ''; return; }
    $('hal1').hidden = diScan;
    $('hal2').hidden = !diScan;
    document.body.classList.toggle('mode-scan', diScan);
    document.querySelector('meta[name="theme-color"]').content = diScan ? '#0B1220' : '#13213C';
    window.scrollTo(0, 0);
    if (diScan) nyalakan(); else { matikan(); perbaruiStatusData(); muatAwal(); }
  }
  window.addEventListener('hashchange', tampilkanHalaman);

  /* =====================================================================
     ANTREAN KIRIM
     Scan langsung dicatat di perangkat, lalu dikirim ke server di latar belakang.
     Antrean disimpan di HP, jadi tidak hilang walau sinyal putus atau halaman ditutup.
     ===================================================================== */
  let mengirim = false;
  let timerUlang;

  function idAcak() {
    const huruf = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const acak = crypto.getRandomValues(new Uint8Array(10));
    return Array.from(acak, b => huruf[b % huruf.length]).join('');
  }

  function perbaruiInfoAntrean() {
    const n = antrean.length;
    ['sinkron1', 'sinkron2'].forEach(id => {
      const el = $(id);
      el.hidden = !n;
      el.querySelector('.jumlah').textContent = n > 99 ? '99+' : n;
      el.setAttribute('aria-label', n + ' data belum terkirim, ketuk untuk kirim sekarang');
      el.title = n + ' belum terkirim';
    });
  }
  ['sinkron1', 'sinkron2'].forEach(id => $(id).onclick = () => { clearTimeout(timerUlang); timerUlang = null; kirimAntrean(); });

  async function kirimAntrean() {
    if (mengirim || !antrean.length) return;
    mengirim = true;
    clearTimeout(timerUlang);
    timerUlang = null;
    const paket = antrean.slice(0, 50);
    try {
      const r = await panggil('batch', { items: paket });
      const selesai = new Set(r.hasil.map(h => h.id));
      const waktuKirim = Date.now();
      antrean.filter(it => selesai.has(it.id)).forEach(it => baruTerkirim.push({ ...it, dikirim: waktuKirim }));
      antrean = antrean.filter(it => !selesai.has(it.id));
      simpanLokal('antrean', JSON.stringify(antrean));
    } catch (err) {
      console.warn('Kirim tertunda:', err.message);
      timerUlang = setTimeout(kirimAntrean, 5000);   // coba lagi 5 detik kemudian
    } finally {
      mengirim = false;
      perbaruiInfoAntrean();
      if (antrean.length && !timerUlang) setTimeout(kirimAntrean, 200);   // sisa antrean > 50
    }
  }
  setInterval(kirimAntrean, 15000);
  window.addEventListener('online', kirimAntrean);

  function sinkron() {
    panggil('hariIni', {})
      .then(d => { terapkanHariIni(d); simpanCache(); })
      .catch(() => {});
  }
  setInterval(sinkron, SINKRON_MS);

  /* ================= HALAMAN 2 ================= */
  let scanner;
  let hadap = bacaLokal('hadapKamera', 'environment');   // 'environment' = belakang, 'user' = depan
  let menyalakan = false;
  let kameraAktif = false;
  const riwayatQR = new Map();

  function buatScanner() {
    if (typeof Html5Qrcode === 'undefined') throw new Error('LIB');
    return scanner = scanner || new Html5Qrcode('reader', {
      verbose: false,
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });
  }
  const opsiScan = { fps: 15 };

  function pesanKamera(err) {
    const e = String(err && (err.name || '') + ' ' + (err.message || err));
    if (e.includes('LIB'))
      return 'Komponen pemindai gagal dimuat. Periksa koneksi internet, lalu muat ulang halaman.';
    if (!window.isSecureContext || !navigator.mediaDevices)
      return 'Halaman harus dibuka lewat alamat https://, bukan dari file di komputer atau http://. '
           + 'Kalau dibuka dari WhatsApp/Instagram, buka lewat Chrome atau Safari.';
    if (diGAS)
      return 'Google Apps Script memblokir akses kamera di halamannya. Pakai halaman versi GitHub Pages, '
           + 'atau sementara ini pakai tombol foto di bawah.';
    if (/NotAllowed|Permission/i.test(e))
      return 'Izin kamera ditolak. Klik ikon gembok/kamera di samping alamat situs, izinkan Kamera, lalu muat ulang halaman.';
    if (/NotReadable|TrackStart|Could not start/i.test(e))
      return 'Kamera sedang dipakai aplikasi lain (Zoom, Meet, WhatsApp, dll). Tutup aplikasi itu lalu tekan Coba lagi.';
    if (/NotFound|Overconstrained|no camera/i.test(e))
      return 'Kamera tidak ditemukan di perangkat ini.';
    return 'Kamera belum bisa dibuka (' + e.trim() + ').';
  }

  async function nyalakan() {
    if (menyalakan || kameraAktif) return;
    menyalakan = true;
    $('mulaiTeks').textContent = 'Menyalakan kamera…';
    $('btnMulai').hidden = true;
    $('btnFoto').hidden = true;
    try {
      const sc = buatScanner();
      try {
        await sc.start({ facingMode: hadap }, opsiScan, saatTerbaca, () => {});
      } catch (err1) {
        if (/NotAllowed|Permission/i.test(String(err1))) throw err1;
        const kamera = await Html5Qrcode.getCameras();
        if (!kamera.length) throw new Error('NotFoundError');
        await sc.start(kamera[kamera.length - 1].id, opsiScan, saatTerbaca, () => {});
      }
      kameraAktif = true;
      $('bidik').classList.add('aktif');
      $('bidik').classList.toggle('cermin', hadap === 'user');
      const labelGanti = hadap === 'user' ? 'Ganti ke kamera belakang' : 'Ganti ke kamera depan';
      $('btnGanti').setAttribute('aria-label', labelGanti);
      $('btnGanti').title = labelGanti;
      Html5Qrcode.getCameras()
        .then(list => { $('btnGanti').hidden = list.length < 2; })
        .catch(() => { $('btnGanti').hidden = true; });
    } catch (err) {
      console.error('Kamera:', err);
      $('mulaiTeks').textContent = pesanKamera(err);
      $('btnMulai').hidden = false;
      $('btnFoto').hidden = false;
    } finally {
      menyalakan = false;
      if (location.hash !== '#scan') matikan();
    }
  }

  async function matikan() {
    if (kameraAktif) { kameraAktif = false; try { await scanner.stop(); } catch (e) {} }
    $('bidik').classList.remove('aktif');
    $('hasil').hidden = true;
  }

  $('btnMulai').onclick = nyalakan;

  $('btnGanti').onclick = async () => {
    $('btnGanti').disabled = true;
    await matikan();
    hadap = hadap === 'user' ? 'environment' : 'user';
    simpanLokal('hadapKamera', hadap);
    await nyalakan();
    $('btnGanti').disabled = false;
  };

  $('inFoto').onchange = async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const r = await buatScanner().scanFileV2(file, false);
      saatTerbaca(r.decodedText);
    } catch (err) {
      tampilHasil('Gagal', 'Foto ulang lebih dekat dan terang', 'QR tidak terbaca', '');
    }
  };

  /* ---------- Proses hasil scan: langsung, tanpa menunggu server ---------- */
  function saatTerbaca(teks) {
    const no = String(teks).trim();
    const now = Date.now();
    if (now - (riwayatQR.get(no) || 0) < JEDA_QR_SAMA_MS) return;
    riwayatQR.set(no, now);

    const sw = siswaMap.get(no);
    if (!sw) {
      tampilHasil('Gagal', 'Tidak terdaftar', no, '');
      bunyi(220); getar([80, 60, 80]);
      return;
    }

    cekGantiHari();
    const daftar = mode === 'pulang' ? hariIni.pulang : hariIni.datang;

    const lama = daftar.get(no);
    if (lama) {
      tampilHasil('Sudah', 'Sudah presensi ' + mode, sw.nama, sw.kelas);
      bunyi(440); setTimeout(() => bunyi(440), 180); getar([60, 60, 60]);
      return;
    }

    const t = sekarang();
    const ket = mode === 'pulang' ? 'Pulang' : (jamMenit(t) > batas ? 'Terlambat' : 'Datang');
    const jam = jamDetik(t);
    daftar.set(no, { ket, jam });
    simpanCache();

    antrean.push({ id: idAcak(), qr: no, mode, t, ket, jam });
    simpanLokal('antrean', JSON.stringify(antrean));
    perbaruiInfoAntrean();
    kirimAntrean();

    tampilHasil(ket, ket, sw.nama, sw.kelas);
    bunyi(880); getar(60);
    if (ket === 'Terlambat') setTimeout(() => bunyi(330), 160);
  }

  /* ---------- Notifikasi hasil: Nama · Kelas · Keterangan ---------- */
  const IKON = {
    Datang:    '<path d="M20 6 9 17l-5-5"/>',
    Terlambat: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    Pulang:    '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
    Sudah:     '<path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/>',
    Gagal:     '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'
  };

  let timerHasil;
  function tampilHasil(jenis, keterangan, nama, kelas) {
    const el = $('hasil');
    el.className = 'hasil ' + jenis;
    el.innerHTML =
      '<span class="hasil-ikon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IKON[jenis] + '</svg></span>' +
      '<span class="hasil-teks"><span class="hasil-nama"></span>' +
      '<span class="hasil-baris"><span class="hasil-kelas"></span><span class="hasil-ket"></span></span></span>';
    el.querySelector('.hasil-nama').textContent = nama;
    el.querySelector('.hasil-kelas').textContent = kelas ? 'Kelas ' + kelas : '';
    el.querySelector('.hasil-kelas').hidden = !kelas;
    el.querySelector('.hasil-ket').textContent = keterangan;
    el.hidden = false;
    el.classList.remove('muncul'); void el.offsetWidth; el.classList.add('muncul');
    clearTimeout(timerHasil);
    timerHasil = setTimeout(() => { el.hidden = true; }, LAMA_HASIL_MS);
  }

  /* ---------- Suara & getar ---------- */
  let ctx;
  function bunyi(freq) {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq; g.gain.value = 0.08;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.15);
    } catch (e) {}
  }
  function getar(pola) { if (navigator.vibrate) navigator.vibrate(pola); }

  /* ---------- Offline / online ---------- */
  function perbaruiJaringan() { $('pitaOffline').hidden = navigator.onLine; }
  window.addEventListener('online', perbaruiJaringan);
  window.addEventListener('offline', perbaruiJaringan);
  perbaruiJaringan();

  /* ---------- PWA: simpan halaman untuk dipakai offline ---------- */
  if ('serviceWorker' in navigator && !diGAS && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker gagal:', err));
  }
  let promptPasang = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    promptPasang = e;
    $('btnPasang').hidden = false;
  });
  $('btnPasang').onclick = async () => {
    if (!promptPasang) return;
    promptPasang.prompt();
    await promptPasang.userChoice.catch(() => {});
    promptPasang = null;
    $('btnPasang').hidden = true;
  };
  window.addEventListener('appinstalled', () => { $('btnPasang').hidden = true; });

  /* ---------- Mulai ---------- */
  if (!diGAS && API_URL.includes('GANTI_DENGAN')) {
    alert('API_URL belum diisi. Buka index.html dan isi API_URL dengan URL Web App (.../exec).');
  }
  perbaruiInfoAntrean();
  perbaruiStatusData();
  perbaruiJam();
  tampilkanHalaman();                          // di halaman 1 sekaligus memuat data
  if (location.hash === '#scan') muatAwal();
  kirimAntrean();
</script>
</body>
</html>
